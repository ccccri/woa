AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  WOA - Wake On Alexa. Alexa Smart Home skill backend that wakes computers
  with Wake on LAN through the user's Echo. Sized to stay in the AWS free tier.

Parameters:
  SkillId:
    Type: String
    Description: Alexa skill ID (amzn1.ask.skill....). Only this skill can invoke the backend.
    AllowedPattern: "amzn1\\.ask\\.skill\\.[0-9a-f-]+"
  LwaClientId:
    Type: String
    Description: Login with Amazon security profile client ID (used for account linking and the setup page).
  AlexaClientId:
    Type: String
    Description: Skill > Permissions > Send Alexa Events > Alexa Skill Messaging client ID.
  AlexaClientSecret:
    Type: String
    NoEcho: true
    Description: Skill > Permissions > Send Alexa Events > Alexa Skill Messaging client secret.
  SetupPageOrigin:
    Type: String
    Default: https://ccccri.github.io
    Description: Origin of the configuration page allowed to call the API (CORS).
  GatewayOrder:
    Type: String
    Default: EU,NA,FE
    Description: Alexa Event Gateway regions to try, in order, for users whose region is not known yet.
  AlertEmail:
    Type: String
    Description: Email that receives cost alerts (confirm the AWS Notification email once).
    AllowedPattern: "[^@\\s]+@[^@\\s]+\\.[^@\\s]+"
  StopAtUsd:
    Type: Number
    Default: 0.5
    Description: Monthly cost (USD, before credits) at which the kill switch stops the WOA functions.

Globals:
  Function:
    Runtime: python3.14
    Architectures: [arm64]
    MemorySize: 128
    CodeUri: src/
    Environment:
      Variables:
        TABLE_NAME: !Ref Table
        LWA_CLIENT_ID: !Ref LwaClientId
        GATEWAY_ORDER: !Ref GatewayOrder

Resources:
  # Provisioned capacity within the always-free DynamoDB tier (25 RCU / 25 WCU).
  Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${AWS::StackName}-data"
      BillingMode: PROVISIONED
      ProvisionedThroughput: {ReadCapacityUnits: 5, WriteCapacityUnits: 5}
      AttributeDefinitions:
        - {AttributeName: pk, AttributeType: S}
        - {AttributeName: sk, AttributeType: S}
      KeySchema:
        - {AttributeName: pk, KeyType: HASH}
        - {AttributeName: sk, KeyType: RANGE}
      TimeToLiveSpecification: {AttributeName: ttl, Enabled: true}
      SSESpecification: {SSEEnabled: true}

  SkillFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-skill"
      Description: WOA Alexa Smart Home skill handler
      Handler: woa.skill_handler.lambda_handler
      Timeout: 20
      Environment:
        Variables:
          ALEXA_CLIENT_ID: !Ref AlexaClientId
          ALEXA_CLIENT_SECRET: !Ref AlexaClientSecret
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref Table}
        - Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-skill"
      Events:
        Alexa:
          Type: AlexaSkill
          Properties:
            SkillId: !Ref SkillId

  SkillFunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-skill"
      RetentionInDays: 14

  # API for the configuration page, exposed with a free Lambda Function URL.
  WebFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-web"
      Description: WOA configuration page API
      Handler: woa.web_handler.lambda_handler
      Timeout: 15
      Environment:
        Variables:
          ALEXA_CLIENT_ID: !Ref AlexaClientId
          ALEXA_CLIENT_SECRET: !Ref AlexaClientSecret
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref Table}
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: [!Ref SetupPageOrigin]
          AllowMethods: [GET, POST, DELETE]
          AllowHeaders: [authorization, content-type]
          MaxAge: 3600

  WebFunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-web"
      RetentionInDays: 14

  # ---------------------------------------------------------------------------
  # Cost guard (D-016): email at the first cent, kill switch at StopAtUsd.
  # Budget amounts exclude credits, so any real usage is visible immediately.
  CostAlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AWS::StackName}-cost-alerts"
      Subscription:
        - {Protocol: email, Endpoint: !Ref AlertEmail}

  CostAlertTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref CostAlertTopic]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: budgets.amazonaws.com}
            Action: SNS:Publish
            Resource: !Ref CostAlertTopic
            Condition:
              StringEquals: {"aws:SourceAccount": !Ref AWS::AccountId}

  CostBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub "${AWS::StackName}-cost-guard"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: {Amount: 1, Unit: USD}
        CostTypes:
          IncludeCredit: false
          IncludeRefund: false
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 1         # 1% of the 1 USD limit = first cent
            ThresholdType: PERCENTAGE
          Subscribers:
            - {SubscriptionType: EMAIL, Address: !Ref AlertEmail}
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: !Ref StopAtUsd
            ThresholdType: ABSOLUTE_VALUE
          Subscribers:
            - {SubscriptionType: SNS, Address: !Ref CostAlertTopic}
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - {SubscriptionType: EMAIL, Address: !Ref AlertEmail}

  KillSwitchFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-killswitch"
      Description: Stops the WOA functions when the cost budget is exceeded
      Handler: woa.killswitch.lambda_handler
      Timeout: 30
      Environment:
        Variables:
          TARGET_FUNCTIONS: !Sub "${AWS::StackName}-skill,${AWS::StackName}-web"
      Policies:
        - Statement:
            - Effect: Allow
              Action: lambda:PutFunctionConcurrency
              Resource:
                - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-skill"
                - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-web"
      Events:
        CostAlert:
          Type: SNS
          Properties:
            Topic: !Ref CostAlertTopic

  KillSwitchFunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-killswitch"
      RetentionInDays: 14

Outputs:
  SkillFunctionArn:
    Description: Paste this ARN as the Smart Home skill "Default endpoint".
    Value: !GetAtt SkillFunction.Arn
  ApiUrl:
    Description: Put this URL in docs/config.js (apiUrl).
    Value: !GetAtt WebFunctionUrl.FunctionUrl
